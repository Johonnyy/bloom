# Copied from amber-infra/ci-templates/release.yml and pointed at this repo.
#
# Publishing only. It deliberately does NOT deploy: a green build is not a decision
# to run something on Server A. Deploying means bumping the pin in
# /etc/amber-infra/bloom/docker-compose.prod.yml and running `docker compose up -d`,
# or deploy/rollback.sh.
#
# The template's `stable` job is deleted here. That moving tag exists for Server B
# app agents that opt into Watchtower; Bloom is a core service on Server A, exact
# pinned, with `com.centurylinklabs.watchtower.enable: "false"` in its compose. A
# :stable tag it would never run is a tag that eventually gets used by mistake.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bloom
          # latest=false is NOT optional. metadata-action tags any semver push
          # :latest by default, and the rule in this ecosystem is that no server
          # ever runs a moving tag it did not opt into.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          # Repo root, unlike sync-store's ./sync-store — this repo *is* the app.
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment note
        run: |
          {
            echo "### Published, not deployed"
            echo ""
            echo "To roll this out, bump the pin in"
            echo '`/etc/amber-infra/bloom/docker-compose.prod.yml` and run'
            echo '`docker compose up -d`, or use `deploy/rollback.sh bloom <tag>`.'
          } >> "$GITHUB_STEP_SUMMARY"
